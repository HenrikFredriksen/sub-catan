name: Perf gate

on:
  push:
    branches: [ main, 7-Runtime-optimiastion ]
  pull_request:
    branches: [ main ]

jobs:
  speed-check:
    runs-on: ubuntu-latest

    steps:
    # 1 checkout ----------------------------------------------------------
    - uses: actions/checkout@v4

    # 2 blank Miniconda env (just Python) --------------------------------
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.11"          # creates env 'sub-env'
        activate-environment: sub-env

    # 3 install deps with pip --------------------------------------------
    - name: Install Python deps
      run: |
        pip install -r requirements.txt

    # 4 download baseline artefact ---------------------------------------
    - name: Get baseline wall-time from main
      if: github.event.pull_request
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: perf-gate.yml
        branch: main
        name: wall-main
        path: perf

    # 5 profile current commit -------------------------------------------
    - name: Profile (5 episodes)
      run: |
        chmod +x scripts/run_profile.sh
        EPISODES=5 scripts/run_profile.sh smoke
        grep "WALL" perf/smoke_*.log | awk '{print $2}' > perf/wall-pr

    # 6 upload new artefact ----------------------------------------------
    - uses: actions/upload-artifact@v4
      with:
        name: wall-${{ github.ref_name }}
        path: perf/wall-pr

    # 7 compare vs baseline ----------------------------------------------
    - name: Compare with baseline
      run: |
        BASE=$(cat perf/wall-main 2>/dev/null || echo 0)
        PR=$(cat perf/wall-pr)
        echo "baseline=$BASE  pr=$PR"
        if (( $(echo "$BASE > 0" | bc -l) )); then
          RATIO=$(echo "$PR / $BASE" | bc -l)
          if (( $(echo "$RATIO > 1.20" | bc -l) )); then
            echo "::error::Runtime regression: $PR s vs $BASE s"
            exit 1
          fi
        fi
